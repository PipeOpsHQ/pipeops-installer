name: Sync Igris Agent Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Halo release tag to sync (e.g., v1.6.3). Required unless repository_dispatch supplies one."
        required: false
        type: string
  repository_dispatch:
    types: [igris_released]

permissions:
  contents: write

concurrency:
  group: sync-igris-release
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PipeOpsHQ/halo is a PRIVATE repo, so this workflow can't use the
      # default GITHUB_TOKEN (it's scoped to pipeops-installer only). It
      # requires a separate PAT, stored in this repo's Actions secrets as
      # HALO_REPO_TOKEN, with at least:
      #   - Repository access: PipeOpsHQ/halo
      #   - Permissions: Contents (read) + Metadata (read)
      #
      # Run this step first so a missing/invalid PAT fails the job with a
      # clear, actionable error — not a cryptic mid-job 401 from gh.
      - name: Verify HALO_REPO_TOKEN
        env:
          GH_TOKEN: ${{ secrets.HALO_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            cat >&2 <<'EOF'
          ::error::HALO_REPO_TOKEN secret is not set on this repository.

          The sync workflow needs a Personal Access Token with read access
          to PipeOpsHQ/halo (a private repo).

          To provision:
            1. Create a fine-grained PAT at
               https://github.com/settings/personal-access-tokens/new
               * Resource owner: PipeOpsHQ
               * Repository access: Only select repositories → PipeOpsHQ/halo
               * Repository permissions:
                   - Contents: Read-only
                   - Metadata: Read-only (auto-included)
            2. Copy the generated token.
            3. Add it as an Actions secret named HALO_REPO_TOKEN at
               https://github.com/PipeOpsHQ/pipeops-installer/settings/secrets/actions
            4. Re-run this workflow.
          EOF
            exit 1
          fi

          # Probe the API once with the supplied token. A 200 means the
          # token is valid AND has access to halo. Anything else means the
          # token is bad — surface the actual status code so the operator
          # can tell expired-vs-revoked-vs-missing-scope apart.
          if ! status=$(gh api -i "repos/PipeOpsHQ/halo" --jq '.full_name' 2>&1); then
            cat >&2 <<EOF
          ::error::HALO_REPO_TOKEN is set but cannot read PipeOpsHQ/halo.

          API response:
          ${status}

          Common causes:
            * PAT expired — rotate at https://github.com/settings/personal-access-tokens
            * PAT lacks "Contents: Read" on PipeOpsHQ/halo
            * PAT was created against the wrong resource owner (must be PipeOpsHQ, not a personal account)
            * Repo was renamed or the token was scoped to a different repo

          See the comment block above the Verify step for re-provisioning steps.
          EOF
            exit 1
          fi
          echo "::notice::HALO_REPO_TOKEN verified — can read PipeOpsHQ/halo"

      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.HALO_REPO_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-}"

          # repository_dispatch payload takes priority
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            dispatch_tag='${{ github.event.client_payload.tag }}'
            [[ -n "$dispatch_tag" ]] && tag="$dispatch_tag"
          fi

          # Do not infer a default here. The halo repo has multiple historical
          # Igris version lines; GitHub's latest label can regress the public
          # installer, while highest semver can select an old legacy-line build.
          # Public releases must be synced from an explicit, intentional tag.
          if [[ -z "$tag" ]]; then
            echo "::error::No Halo release tag supplied. Run this workflow with an explicit tag such as v1.6.3."
            exit 1
          fi

          echo "Resolved tag: ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          # Extract version number (strip leading v)
          version="${tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Download assets from halo
        env:
          GH_TOKEN: ${{ secrets.HALO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'
          mkdir -p dist

          echo "Downloading release assets for ${tag}..."
          gh release download "$tag" \
            --repo PipeOpsHQ/halo \
            --dir dist \
            --pattern '*.tar.gz' \
            --pattern '*.zip' \
            --pattern 'checksums.txt'

          echo "Downloaded assets:"
          ls -lh dist/

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'

          if gh release view "$tag" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release ${tag} already exists, will update"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'
          version='${{ steps.resolve.outputs.version }}'

          notes="Igris Agent ${version} — synced from [PipeOpsHQ/halo ${tag}](https://github.com/PipeOpsHQ/halo/releases/tag/${tag})"

          if [[ '${{ steps.check.outputs.exists }}' == 'true' ]]; then
            echo "Deleting existing release ${tag}..."
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          fi

          echo "Creating release ${tag}..."
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Igris Agent ${version}" \
            --notes "$notes" \
            dist/*

          echo "✓ Release ${tag} published with $(ls dist/ | wc -l) assets"

      - name: Sync full installer script from halo-gateway
        env:
          GH_TOKEN: ${{ secrets.HALO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'
          version='${{ steps.resolve.outputs.version }}'

          # Pull the CANONICAL install script from halo at the released tag.
          # Previously this step only sed'd the VERSION= line, leaving the
          # rest of igris.sh frozen — so features added to halo's installer
          # (--daemon, update detection, OpenRC/launchd hardening, etc.)
          # never reached the CDN. Now we mirror the whole file so the CDN
          # script stays in lock-step with the released agent.
          echo "Fetching scripts/install-agent.sh from PipeOpsHQ/halo @ ${tag}..."
          gh api "repos/PipeOpsHQ/halo/contents/scripts/install-agent.sh?ref=${tag}" \
            --jq '.content' | base64 -d > igris.sh.new

          if [[ ! -s igris.sh.new ]]; then
            echo "::error::Downloaded igris.sh is empty — refusing to clobber the live CDN script."
            exit 1
          fi

          # Sanity: shellcheck-free syntax check, plus require the canonical
          # entrypoint marker so we don't accidentally serve an unrelated
          # file if the upstream path ever moves.
          bash -n igris.sh.new
          if ! grep -q 'Igris Agent Installer' igris.sh.new; then
            echo "::error::Sanity check failed: downloaded script doesn't look like the Igris installer."
            exit 1
          fi

          # The VERSION fallback in halo's repo can lag the release until the
          # update-install-script job in halo-gateway runs. Force-set only the
          # fallback so explicit IGRIS_VERSION requests still bypass discovery.
          awk -v version="${version}" '
            /^VERSION="\$\{REQUESTED_VERSION:-/ {
              print "VERSION=\"${REQUESTED_VERSION:-" version "}\""
              next
            }
            /^VERSION="/ {
              print "VERSION=\"" version "\""
              next
            }
            { print }
          ' igris.sh.new > igris.sh.tmp
          mv igris.sh.tmp igris.sh.new

          chmod +x igris.sh.new
          mv igris.sh.new igris.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet igris.sh; then
            git add igris.sh
            git commit -m "chore(igris): sync from halo ${tag} (VERSION=${version})"
            git push
          else
            echo "igris.sh already in sync with ${tag}, no update needed"
          fi

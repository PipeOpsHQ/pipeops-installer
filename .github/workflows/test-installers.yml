name: Test Installers

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Syntax check installers
        run: bash -n igris.sh vortex.sh tests/igris_vortex_bundle_test.sh tests/vortex_installer_test.sh
      - name: Run installer tests
        run: |
          bash tests/igris_vortex_bundle_test.sh
          bash tests/vortex_installer_test.sh
      - name: ShellCheck
        run: shellcheck -x -e SC2009,SC2064,SC2162 igris.sh vortex.sh tests/igris_vortex_bundle_test.sh tests/vortex_installer_test.sh
